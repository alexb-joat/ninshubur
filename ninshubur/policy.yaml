# Ninshubur shipped policy. A user policy at ~/.ninshubur/policy.yaml may TIGHTEN
# these settings (more denied hosts, fewer allowed fields, smaller caps) but can
# never loosen them. The merge rules live in ninshubur/policy.py.

fetch:
  https_only_except_local: true
  follow_redirects: same_host_only
  max_hops: 2
  robots:
    honour: true
    cache_s: 86400
    default_crawl_delay_s: 1.0
  denied_hosts:
    - linkedin.com
    - www.linkedin.com
    - facebook.com
    - www.facebook.com
    - x.com
    - twitter.com
    - www.twitter.com
    - reddit.com
    - www.reddit.com
    - old.reddit.com
  max_body_bytes_default: 2000000
  max_body_bytes_hard: 8000000
  decompression_ratio_max: 100
  # Total seconds for one request, from connect to the last byte. The per-read timeout alone lets a server
  # that sends one byte every 29 s hold a fetch for hours.
  request_deadline_s: 20
  per_host_rps_max: 1.0
  # Hostnames that resolve to loopback, private, link-local, CGNAT or ULA addresses are never contacted.
  refuse_private_addresses: true
  # The one relaxation of "never fetch a URL found in content": an adapter listed here may follow links
  # discovered on a page it was admitted to fetch, under every constraint below. Nothing else may.
  derived_links:
    allowed_adapters: [event_sites]
    same_host_only: true
    max_per_document: 4
    path_terms: [speaker, sponsor, exhibitor, partner, lineup, agenda]
    max_query_len: 200
  # Documented invariants. There is no code path for any of these; tests assert it.
  never: [login, captcha_bypass, paywall_bypass, proxies, fingerprint_evasion]

# Fences for the explorer (ninshubur/explorer): open-web discovery, kept apart from the sources above. A "site" is a
# registrable domain from the vendored Public Suffix List, so endless subdomains of one name share one budget.
explorer:
  max_url_len: 512
  max_depth: 6              # path segments
  max_query_params: 4
  hosts_per_site: 4         # a fifth subdomain of one site is refused: wildcard DNS mints names without end
  pages_per_site_day: 20
  pages_per_shape: 8        # URLs that differ only in their numbers (calendars, pagination, id runs) on one site
  max_body_bytes: 1000000
  daily_bytes: 50000000     # the explorer's own budget, apart from budgets.daily_bytes
  min_delay_s: 5.0          # between two requests to one host
  near_duplicate_hamming: 3 # simhash bits apart that still count as "the same page" (64-bit, k=3: Manku et al., WWW 2007)
  near_duplicate_share: 0.6 # of the last 10 pages on a site; above it the site is stopped (generated mazes)
  no_yield_pages: 30        # pages fetched with nothing useful found; then the site is stopped
  probe_tries: 3            # soft-404 probes without an answer (site down, robots.txt says no), one a day; then stopped
  year_min: 1995            # a date in a URL outside year_min .. this year + years_ahead marks a walked calendar
  years_ahead: 2
  content_types: [text/html, application/json]
  # The parser runs in a bubblewrap sandbox (no network, no home, cleared environment); these bound one page's cost.
  parser_memory_mb: 1024    # address space
  parser_cpu_s: 10
  parser_timeout_s: 20      # wall clock; then the sandbox's whole process group is killed
  tripwire_ssrf: 3          # attempts to reach a denied address (connect, redirect) that stop the explorer
  tripwire_window_s: 86400  # ... counted over this window, from the last `explore resume` or tripwire stop at most
  disk_quota_bytes: 500000000  # the explorer folder (its database, logs, handoff); over it, `explore run` refuses

admission:
  min_field_validity: 0.95
  required_trust_fields: [tier, owner, owner_url, terms_url, licence, legal_basis,
                          expected_content_type, schema, reviewed_by, reviewed_at, review_every_days]
  tiers:
    0: {name: authoritative, reputation: 0.90, review_every_days: 180, value_factor: 1.0, confidence_cap: 0.95}
    1: {name: curated,       reputation: 0.75, review_every_days: 120, value_factor: 1.0, confidence_cap: 0.95}
    2: {name: aggregator,    reputation: 0.50, review_every_days: 90,  value_factor: 0.8, confidence_cap: 0.50}
    3: {name: user_generated, reputation: 0.35, review_every_days: 60, value_factor: 0.6, confidence_cap: 0.50}

# Deltas and thresholds below are written for Tier 0 (start 0.90); for lower tiers every
# value is multiplied by tier_default / 0.90 so penalties stay proportional.
reputation:
  parse_ok: 0.01
  cap_above_default: 0.05
  schema_drift: -0.10
  taint_medium: -0.10
  taint_high: -0.25
  integrity: -0.30
  size_anomaly: -0.05
  decay_weekly: 0.10
  suspect_below: 0.40
  quarantine_below: 0.25
  taint_events_24h: 3
  clear_factor: 0.8

detectors:
  medium_holds: true
  schema_violation_ratio: 0.20
  item_explosion_factor: 5
  max_depth: 32
  base64_run_min: 200
  lookalike_max_distance: 2

person_data:
  allowed_sources: [apollo, hubspot, platform, mastodon, bluesky, event_sites]
  allowed_fields: [name, handle, title, company, company_domain, office_city, country, tz, seniority, department]
  forbidden_fields: [home_address, street, postcode, personal_email, personal_phone, dob, photo]
  location_granularity: city
  social:
    skip_noindex: true
    skip_undiscoverable: true
    skip_no_unauthenticated_label: true
  llm:
    require_local: true

legal_basis:
  allowed: [legitimate_interest, contract, public_business_info, licensed]

retention:
  months: 12
  sweep_every_s: 3600
  snapshots_days: 30
  quarantine_days: 90

corroboration:
  value_usd: 300

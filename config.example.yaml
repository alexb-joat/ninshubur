# Copy to ~/.ninshubur/config.yaml (or set NINSHUBUR_CONFIG). Secrets never go here: only env var names.
user_agent: "Ninshubur/0.1 (+https://github.com/alexb-joat/ninshubur; contact: https://github.com/alexb-joat/ninshubur/issues)"
timezone: Europe/Lisbon

llm:
  local: {base_url: http://127.0.0.1:11434/v1, model: qwen2.5:7b, embed_model: nomic-embed-text}
  cloud: {enabled: false, base_url: https://api.openai.com/v1, api_key_env: NINSHUBUR_CLOUD_KEY, model: gpt-5-mini}
  caps: {daily_usd: 0.50, daily_tokens: 300000}
  person_data: local_only

budgets: {daily_bytes: 200000000, daily_human_minutes: 45, hourly_rate_usd: 60}
scheduler: {tick_s: 30, max_concurrent_sources: 4, per_host_rps: 1.0, boost_cooldown_s: 600, jitter: 0.10}
retention_months: 12
corroboration_value_usd: 300

# Costs used for ranking (USD and minutes). Tune these to your reality; the formula is shown in every suggestion.
costs:
  travel_same_city_usd: 0
  travel_same_country_usd: 150
  travel_abroad_usd: 600
  minutes: {conference_prospecting: 20, cfp_submit: 120, hiring_signal_outreach: 15, service_request_lead: 10, tool_outage: 0}
# Expected value per suggestion kind before relevance/confidence/timing scaling (placeholders until feedback calibrates them).
base_value_usd:
  service_request_lead: 400
  hiring_signal_outreach: 250
  conference_prospecting: 600
  cfp_submit: 800
  tool_outage: 50

sinks:
  ics: {path: feeds/timings.ics}
  trello: {enabled: false, key_env: TRELLO_KEY, token_env: TRELLO_TOKEN, list_id: ""}
  google_calendar: {enabled: false, credentials_env: GOOGLE_CAL_CREDENTIALS_JSON, calendar_id: primary}
  platform: {enabled: false, base_url: "", token_env: PLATFORM_API_TOKEN}
api: {host: 127.0.0.1, port: 8791}

# Every source needs a full trust block (admission criteria H1-H8). `ninshubur sources test NAME`
# runs the checklist; sources past their review date stop fetching.
sources:
  confs-2026:
    adapter: confs_tech
    params: {years: [2025, 2026], topics: [general, javascript, devops, data, python]}
    trust:
      tier: 1
      owner: "tech-conferences (community project)"
      owner_url: https://github.com/tech-conferences/conference-data
      terms_url: https://github.com/tech-conferences/conference-data/blob/main/LICENSE.md
      licence: MIT
      legal_basis: public_business_info
      rate_limit: "GitHub raw; ETag; we fetch <= 1/day per file"
      expected_content_type: text/plain|application/json
      schema: confs_tech.v1
      reviewed_by: alex
      reviewed_at: 2026-10-12
      review_every_days: 120

  # Event websites, batch-admitted: the homepage of every event in the confs.tech dataset plus up to
  # four same-host speaker/sponsor/exhibitor pages. Fixed hosts do not exist here; the allowlist for each
  # run is built from the dataset's event URLs, never from a page. See docs/USAGE.md "Conference prospecting".
  event-sites:
    adapter: event_sites
    params: {events_per_day: 20, pages_per_event: 4, include_past_days: 365, recrawl_upcoming_days: 7}
    trust:
      tier: 2
      owner: "individual event organisers (homepages listed in the confs.tech dataset)"
      owner_url: https://github.com/tech-conferences/conference-data
      terms_url: https://github.com/tech-conferences/conference-data/blob/main/LICENSE.md
      licence: "each site's own terms; robots.txt honoured; public listings only, structured data first"
      legal_basis: public_business_info
      rate_limit: "1 req/s per host; <= 5 pages per event; <= 20 events/day"
      expected_content_type: text/html
      schema: event_org.v1
      reviewed_by: alex
      reviewed_at: 2026-10-14
      review_every_days: 90

  hn-freelancer:
    adapter: hn
    params: {whoishiring: true, freelancer_threads: true, show_hn_queries: [lead generation, outbound]}
    trust:
      tier: 2
      owner: "Algolia (HN Search API)"
      owner_url: https://hn.algolia.com/api
      terms_url: https://hn.algolia.com/api
      licence: "public API, no key; request ceiling to verify (commonly cited 10 000/h)"
      legal_basis: public_business_info
      rate_limit: "self-cap 1 req/s; a few dozen requests/day"
      expected_content_type: application/json
      schema: hn_story.v1
      reviewed_by: alex
      reviewed_at: 2026-10-12
      review_every_days: 90

  # LLM provider documentation (Tier 0): feeds Euboulia's catalog. Only the pages hard-coded in the adapter
  # are fetched; the ChatGPT help centre blocks automated readers and is left out on purpose.
  provider-docs-anthropic:
    adapter: provider_docs
    params: {provider: anthropic}
    trust:
      tier: 0
      owner: "Anthropic (platform.claude.com documentation)"
      owner_url: https://platform.claude.com/docs
      terms_url: https://www.anthropic.com/legal/consumer-terms
      licence: "public documentation; robots.txt allows everything but /api/ (checked 2026-10-14)"
      legal_basis: public_business_info
      rate_limit: "4 pages, <= 1/day, ETag"
      expected_content_type: text/markdown|text/plain
      schema: provider_model.v1
      reviewed_by: alex
      reviewed_at: 2026-10-14
      review_every_days: 90

  provider-docs-openai:
    adapter: provider_docs
    params: {provider: openai, models: [gpt-6-astra, gpt-6.1-sol, gpt-6-sol, gpt-6-luna, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna, gpt-5.5]}
    trust:
      tier: 0
      owner: "OpenAI (developers.openai.com and learn.chatgpt.com documentation)"
      owner_url: https://developers.openai.com/docs
      terms_url: https://openai.com/policies/terms-of-use/
      licence: "public documentation; robots.txt allows all (checked 2026-10-14)"
      legal_basis: public_business_info
      rate_limit: "one page per listed model plus one index page, <= 1/day, ETag"
      expected_content_type: text/markdown|text/plain
      schema: provider_model.v1
      reviewed_by: alex
      reviewed_at: 2026-10-14
      review_every_days: 90

  # Disabled: status.claude.com's robots.txt says `Disallow: /api/` for all agents (checked 2026-10-13),
  # so `sources test` refuses it (H2). Kept as a template for status pages that allow /api/v2/.

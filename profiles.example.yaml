# Copy to ~/.ninshubur/profiles.yaml. One profile per client (or per ideal customer profile).
# Every list is optional, but each suggestion kind needs certain fields; `ninshubur profiles check` tells you which.
profiles:

  # LeadGet's own ideal customer profile.
  leadget-internal:
    industries: [saas, fintech, devtools]
    titles: [VP Sales, Head of Growth, CRO, Founder]
    geos:
      cities: [London, Berlin, Amsterdam, Lisbon]
      countries: [United Kingdom, Germany, Netherlands, Portugal]
    pains: [outbound, pipeline, cold email deliverability, SDR hiring]
    keywords: [lead generation, outbound, appointment setting, sdr, b2b]
    negative_keywords: [internship, unpaid]
    topics: [general, saas, growth, python]
    example_texts: ["We need help booking qualified B2B meetings in Europe"]
    thresholds: {relevance: 0.55, tier_b: 0.70}
    tiers: {b: false, c: false}
    home_base: Lisbon
    home_country: Portugal
    target_companies: [{name: Stripe, domain: stripe.com, greenhouse: stripe}]
    tools_in_use: [{kind: llm_provider, id: anthropic/claude}, {kind: github, repo: ollama/ollama}]
    weights: {service_request_lead: 1.2}

  # Template for a client. Copy, rename to the client's slug, fill in, delete what you do not know.
  client-template:
    # Feeds relevance scoring for service requests and HN posts (whole-word matches).
    industries: [saas]
    # Role names used for hiring signals (title match) and outreach targets.
    titles: [VP Sales, Head of Growth, Founder]
    # Conference trips and local CFPs: cities first, countries as the fallback.
    geos:
      cities: [Berlin, Munich]
      countries: [Germany, Austria, Switzerland]
    # Problems the client solves; used for relevance and content ideas.
    pains: [outbound, pipeline]
    keywords: [lead generation, outbound, appointment setting]
    negative_keywords: [internship]
    # confs.tech topics: general, javascript, devops, data, python, ... (see the confs-2026 source params).
    topics: [general, saas]
    thresholds: {relevance: 0.55, tier_b: 0.70}
    tiers: {b: false, c: false}
    # Where the client's team sits: trips from here are costed by band (same city / same country / abroad).
    home_base: Berlin
    home_country: Germany
    # Companies the client wants to reach. `greenhouse`/`lever` slugs let you admit their job boards as sources
    # (`ninshubur sources add <name> --adapter greenhouse --param 'boards=[slug]' ...`); `name` also matches HN hiring posts.
    target_companies:
      - {name: Example GmbH, domain: example.de, greenhouse: examplegmbh}
    # Providers the client depends on; outage alerts fire for these.
    tools_in_use: [{kind: llm_provider, id: openai}]
    # Per-kind multipliers on expected value for this client.
    weights: {hiring_signal_outreach: 1.0}
